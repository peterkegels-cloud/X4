<style>
/* Layout: one narrow white column, logo header, sticky search + filters, collapsible cards. Single light theme on purpose: always readable outdoors. Palette from the logo: navy + turquoise. */
:root{
  --bg:#ffffff; --surface:#ffffff; --tint:#f2fafb; --fg:#0e2a3b; --muted:#4a6070; --line:#d9e6ea;
  --accent:#00a3b4; --accent-strong:#007d8b; --accent-soft:#e0f6f8;
  --warn:#9a4f00; --warn-soft:#fff1e0; --ok:#1d7a3a; --ok-soft:#e3f5e8; --no:#b42323; --no-soft:#fde8e8;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.55;margin:0}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:0 48px}
.hero{display:flex;align-items:center;gap:14px;padding-block:18px 6px}
.hero img{width:88px;height:88px;border-radius:50%;flex:none}
.hero h1{font-family:var(--f-display);font-weight:700;font-size:30px;line-height:1;margin:0 0 4px;color:var(--fg)}
.hero p{margin:0;color:var(--muted);font-size:14px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px 8px;border-bottom:2px solid var(--accent-soft)}
#q{width:100%;font:inherit;font-size:16px;padding:11px 13px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--fg)}
#q::placeholder{color:#7d909c}
#q:focus{outline:none;border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding-block:10px 2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font:500 14px var(--f-body);padding:7px 13px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--fg);border-color:var(--fg);color:#ffffff}
.chip:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h2.sec{font-family:var(--f-display);font-weight:700;font-size:17px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent-strong);margin:28px 0 10px;display:flex;justify-content:space-between;align-items:baseline}
h2.sec span{font-family:var(--f-mono);font-size:13px;letter-spacing:0;color:var(--muted)}
.base{background:var(--tint);border-radius:12px;padding:16px;display:grid;gap:16px}
.base h3{font-family:var(--f-display);font-weight:700;font-size:19px;margin:0 0 4px;color:var(--fg)}
.kv{display:grid;grid-template-columns:minmax(110px,40%) 1fr;gap:5px 12px;margin:0}
.kv dt{color:var(--muted);font-size:14px}
.kv dd{margin:0;font-weight:600;min-width:0}
.list{display:grid;gap:10px}
details.card{background:var(--surface);border:1.5px solid var(--line);border-radius:12px}
details.card[open]{border-color:var(--accent)}
summary{list-style:none;cursor:pointer;padding:13px 15px;display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:start}
summary::-webkit-details-marker{display:none}
.name{font-family:var(--f-display);font-weight:700;font-size:21px;line-height:1.15;color:var(--fg)}
.tag{font-family:var(--f-mono);font-size:11.5px;color:var(--accent-strong);text-transform:uppercase;letter-spacing:.04em;grid-column:1}
.short{grid-column:1;color:var(--muted);font-size:14px}
.chev{grid-row:1/4;grid-column:2;align-self:center;color:var(--accent-strong);font-size:22px;transition:transform .15s}
details[open] .chev{transform:rotate(90deg)}
.body{padding:12px 15px 15px;display:grid;gap:13px;border-top:1px solid var(--line)}
.flags{display:flex;flex-wrap:wrap;gap:6px}
.flag{font-size:12.5px;font-weight:600;padding:3px 9px;border-radius:6px;background:var(--accent-soft);color:var(--accent-strong)}
.flag.warn{background:var(--warn-soft);color:var(--warn)}
.flag.ok{background:var(--ok-soft);color:var(--ok)}
.flag.no{background:var(--no-soft);color:var(--no)}
.lbl{font-size:11.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0 0 3px}
.body p{margin:0}
.set{list-style:none;margin:0;padding:0;display:grid;gap:5px}
.set li{font-family:var(--f-mono);font-size:13.5px;background:var(--tint);border-left:3px solid var(--accent);border-radius:4px;padding:7px 10px;overflow-wrap:anywhere;color:var(--fg)}
.sit{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.sit li{display:grid;gap:2px;background:var(--tint);border-left:3px solid var(--accent);border-radius:4px;padding:8px 10px}
.sit strong{font-size:14.5px;color:var(--fg)}
.sit span{font-family:var(--f-mono);font-size:13px;color:var(--fg);overflow-wrap:anywhere}
.specs{font-family:var(--f-mono);font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.note{font-size:14px;color:var(--warn);background:var(--warn-soft);border-radius:6px;padding:7px 10px}
.hint{font-size:13.5px;color:var(--muted);margin:14px 0 0}
.empty{color:var(--muted);padding:20px 0;text-align:center}
footer{margin-top:32px;font-size:12.5px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.chev{transition:none}}
</style>

</head>

const GROUPS = [
  {id:"all",label:"Alles"},{id:"base",label:"Basis"},{id:"mo",label:"Momenten"},{id:"ve",label:"Video Enkel"},{id:"v3",label:"Video 360"},
  {id:"fe",label:"Foto Enkel"},{id:"f3",label:"Foto 360"},{id:"os",label:"Opnamesystemen"}
];
const GNAME = {mo:"Opnamemomenten",ve:"Video — Enkel (Single-Lens)",v3:"Video — 360",fe:"Foto — Enkel (Single-Lens)",f3:"Foto — 360",os:"Opnamesystemen"};

let filter = "all";
try { filter = localStorage.getItem("x4f") || "all"; } catch(e) {}
const q = document.getElementById("q"), out = document.getElementById("out"), chips = document.getElementById("chips");

function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

GROUPS.forEach(g=>{
  const b=document.createElement("button");b.className="chip";b.type="button";b.textContent=g.label;b.dataset.id=g.id;
  b.addEventListener("click",()=>{filter=g.id;q.value="";try{localStorage.setItem("x4f",filter)}catch(e){}render();});
  chips.appendChild(b);
});
q.addEventListener("input",render);

function cardHTML(it){
  const flags=it.flags.map(f=>`<span class="flag ${f[1]||""}">${esc(f[0])}</span>`).join("");
  return `<details class="card"><summary>
    <span class="tag">${esc(it.tag)}</span><span class="name">${esc(it.name)}</span><span class="short">${esc(it.short)}</span><span class="chev" aria-hidden="true">›</span>
  </summary><div class="body">
    <div class="flags">${flags}</div>
    <div><p class="lbl">Wat</p><p>${esc(it.wat)}</p></div>
    <div><p class="lbl">Gebruik op de Camino</p><p>${esc(it.gebruik)}</p></div>
    <div><p class="lbl">Instellingen</p><ul class="set">${it.set.map(s=>`<li>${esc(s)}</li>`).join("")}</ul></div>
    ${it.note?`<p class="note">${esc(it.note)}</p>`:""}
    <div><p class="lbl">Specs X4</p><p class="specs">${esc(it.specs)}</p></div>
  </div></details>`;
}


function momHTML(m){
  return `<details class="card"><summary>
    <span class="tag">Opnamemoment${m.tag?" · "+esc(m.tag):""}</span><span class="name">${esc(m.name)}</span><span class="short">${esc(m.doel)}</span><span class="chev" aria-hidden="true">›</span>
  </summary><div class="body">
    <div><p class="lbl">Situatie → opname</p><ul class="sit">${m.sit.map(s=>`<li><strong>${esc(s[0])}</strong><span>${esc(s[1])}</span></li>`).join("")}</ul></div>
    ${m.audio?`<div><p class="lbl">Audio</p><p>${esc(m.audio)}</p></div>`:""}
    ${m.note?`<p class="note">${esc(m.note)}</p>`:""}
  </div></details>`;
}

function baseHTML(term){
  const blocks = BASE.map(b=>{
    const rows = b.rows.filter(r=>!term || (b.title+" "+r.join(" ")).toLowerCase().includes(term));
    if(!rows.length) return "";
    return `<div><h3>${esc(b.title)}</h3><dl class="kv">${rows.map(r=>`<dt>${esc(r[0])}</dt><dd>${esc(r[1])}</dd>`).join("")}</dl></div>`;
  }).join("");
  return blocks ? `<h2 class="sec">Basisinstellingen</h2><section class="base">${blocks}</section>` : "";
}

function render(){
  const t0=q.value.trim();chips.querySelectorAll(".chip").forEach(c=>c.setAttribute("aria-pressed",String(!t0 && c.dataset.id===filter)));
  const term=q.value.trim().toLowerCase();
  let html="";
  const f = term ? "all" : filter;
  if(term) html+=`<p class="hint">Zoekt in alle onderdelen, ook in de details.</p>`;
  if(f==="all"||f==="base") html+=baseHTML(term);
  const groups = f==="all" ? ["mo","ve","v3","fe","f3","os"] : (f==="base"?[]:[f]);
  groups.forEach(g=>{
    const src = g==="mo" ? MOMENTS : ITEMS.filter(it=>it.g===g);
    const list=src.filter(it=>!term || JSON.stringify(it).toLowerCase().includes(term));
    if(!list.length) return;
    const fn = g==="mo" ? momHTML : cardHTML;
    html+=`<h2 class="sec">${GNAME[g]}<span>${list.length}</span></h2><div class="list">${list.map(fn).join("")}</div>`;
  });
  out.innerHTML = html || `<p class="empty">Niets gevonden voor “${esc(q.value)}”.</p>`;
  if(term) out.querySelectorAll("details.card").forEach((d,i)=>{ if(i<3) d.open=true; });
}
render();
</script>

<script>
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').then(r=>{r.update();}).catch(()=>{});
  let reloaded=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(reloaded)return;reloaded=true;location.reload();});
}
</script>
